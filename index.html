<style>
  :root{
    --navy:#0E4156;
    --navy-soft:#2A5D76;
    --orange:#F09223;
    --teal:#336E7C;
    --mint:#7BB8AB;
        --bg:#F6FAFB;
    --surface:#FFFFFF;
    --text:#0E4156;
    --muted:#5C7C8A;
    --line:#E1EBEF;
    --shadow:0 24px 60px -30px rgba(14,65,86,.35);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0B2634;
      --surface:#103445;
      --text:#EAF3F6;
      --muted:#9FBAC6;
      --line:#1D4A5E;
      --mint:#8ECBB8;
      --shadow:0 24px 60px -30px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Tajawal","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100svh;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(60rem 34rem at 82% -8%, rgba(240,146,35,.16), transparent 62%),
      radial-gradient(52rem 32rem at 8% 104%, rgba(51,110,124,.18), transparent 62%);
  }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(1.25rem,4vw,3rem);
  }
  .card{
    width:min(680px,100%);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:clamp(2rem,6vw,3.75rem) clamp(1.5rem,5vw,3.5rem);
    text-align:center;
  }

  /* ---------- logo ---------- */
  .logo{
    display:block;
    margin:0 auto;
  }
  .logo img{
    width:clamp(230px,66vw,360px);
    height:auto;
    display:block;
    margin:0 auto;
  }

  .rule{
    width:64px;height:3px;border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--teal));
    margin:clamp(1.75rem,5vw,2.5rem) auto;
    border:0;
  }

  /* ---------- status ---------- */
  .status-icon{
    position:relative;
    width:clamp(72px,18vw,86px);
    aspect-ratio:1;
    margin:0 auto 1.5rem;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:rgba(240,146,35,.13);
    color:var(--orange);
    border:1px solid rgba(240,146,35,.28);
  }
  .status-icon svg{width:46%;height:46%}
  .status-icon::after{
    content:"";
    position:absolute;
    inset:-9px;
    border-radius:50%;
    border:1px solid rgba(240,146,35,.35);
    animation:ring 2.8s ease-out infinite;
  }
  @keyframes ring{
    0%{transform:scale(.92);opacity:.9}
    70%{transform:scale(1.12);opacity:0}
    100%{opacity:0}
  }

  h1{
    font-size:clamp(1.6rem,6vw,2.35rem);
    font-weight:800;
    line-height:1.4;
    margin:0 0 .6rem;
    color:var(--text);
  }
  .lede{
    font-size:clamp(1rem,3vw,1.1rem);
    color:var(--muted);
    margin:0 auto;
    max-width:42ch;
  }

  /* ---------- contact ---------- */
  .contact{
    margin-top:clamp(2rem,5vw,2.75rem);
    display:grid;
    gap:.75rem;
    grid-template-columns:1fr;
  }
  @media (min-width:520px){
    .contact{grid-template-columns:1fr 1fr}
    .contact a:last-child{grid-column:1 / -1;justify-content:center}
  }
  .contact a{
    display:flex;align-items:center;gap:.85rem;
    padding:.95rem 1.1rem;
    border:1px solid var(--line);
    border-radius:16px;
    text-decoration:none;
    color:var(--text);
    background:transparent;
    transition:border-color .2s ease, transform .2s ease, background-color .2s ease;
  }
  .contact a:hover,.contact a:focus-visible{
    border-color:var(--orange);
    background:rgba(240,146,35,.07);
    transform:translateY(-2px);
  }
  .contact a:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
  .contact .ico{
    flex:none;width:40px;height:40px;border-radius:12px;
    display:grid;place-items:center;
    background:rgba(51,110,124,.12);
    color:var(--teal);
  }
  .contact .ico svg{width:20px;height:20px}
  .contact .txt{text-align:start;min-width:0}
  .contact .label{display:block;font-size:.75rem;color:var(--muted);font-weight:500;line-height:1.5}
  .contact .value{
    display:block;font-size:.98rem;font-weight:700;direction:ltr;text-align:start;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .contact .value.rtl{direction:rtl}

  footer{
    padding:1.5rem;
    text-align:center;
    font-size:.82rem;
    color:var(--muted);
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
