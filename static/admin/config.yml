# لوحة تحكم موقع رواسم — Decap CMS
# الدخول بحساب GitHub له صلاحية كتابة على مستودع RwasimSA/website،
# وكل «حفظ» يصير commit يُبنى ويُنشر تلقائياً خلال دقائق.

backend:
  name: github
  repo: RwasimSA/website
  branch: main
  base_url: https://rwasim.sa
  auth_endpoint: api/oauth/authorize
  commit_messages:
    update: "تحديث {{path}} من لوحة التحكم"
    uploadMedia: "رفع ملف {{path}} من لوحة التحكم"
    deleteMedia: "حذف ملف {{path}} من لوحة التحكم"

locale: ar
site_url: https://rwasim.sa
display_url: https://rwasim.sa
logo_url: /images/rawasim-logo-white.svg

media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: محتوى الموقع
    files:
      - name: stats
        label: أرقام الأثر
        file: content/stats.json
        description: المؤشرات الخمسة المعروضة في الرئيسية وصفحة أثرنا — من أحدث بيانات معتمدة فقط
        fields:
          - { name: beneficiaries, label: عدد المستفيدين, widget: number, value_type: int }
          - { name: hours, label: ساعات التجربة, widget: number, value_type: int }
          - { name: programs, label: البرامج والمشاريع, widget: number, value_type: int }
          - { name: volunteers, label: المتطوعون والمتطوعات, widget: number, value_type: int }
          - { name: partnerships, label: الشراكات, widget: number, value_type: int }

      - name: people
        label: مجلس الإدارة والفريق
        file: content/people.json
        fields:
          - name: board
            label: مجلس الإدارة
            widget: list
            fields:
              - { name: name, label: الاسم, widget: string }
              - { name: role, label: الصفة, widget: string }
              - { name: photo, label: الصورة (اختياري), widget: image, required: false }
          - name: assembly
            label: الجمعية العمومية
            widget: list
            fields:
              - { name: name, label: الاسم, widget: string }
              - { name: photo, label: الصورة (اختياري), widget: image, required: false }
          - name: executive
            label: المدير التنفيذي
            widget: object
            fields:
              - { name: name, label: الاسم, widget: string }
              - { name: role, label: الصفة, widget: string }
              - { name: photo, label: الصورة, widget: image, required: false }
          - name: execWord
            label: كلمة المدير التنفيذي (فقرات)
            widget: list
            field: { name: paragraph, label: فقرة, widget: text }

      - name: documents
        label: وثائق الحوكمة
        file: content/documents.json
        description: بطاقة بلا ملف تظهر بوسم «قريباً» وزر تنزيل معطّل
        fields:
          - name: reports
            label: التقارير والقوائم المالية
            widget: list
            fields:
              - { name: title, label: عنوان الوثيقة, widget: string }
              - { name: type, label: التصنيف, widget: select, options: [التقارير السنوية, القوائم المالية] }
              - { name: year, label: السنة, widget: string, required: false }
              - { name: desc, label: وصف مختصر, widget: text, required: false }
              - { name: file, label: الملف (PDF), widget: file, required: false }
          - name: policies
            label: اللوائح والسياسات والإفصاحات
            widget: list
            fields:
              - { name: title, label: عنوان الوثيقة, widget: string }
              - { name: type, label: التصنيف, widget: select, options: [اللوائح, السياسات, الإفصاحات] }
              - { name: year, label: السنة, widget: string, required: false }
              - { name: desc, label: وصف مختصر, widget: text, required: false }
              - { name: file, label: الملف (PDF), widget: file, required: false }

      - name: media
        label: المركز الإعلامي
        file: content/media.json
        fields:
          - name: news
            label: الأخبار
            widget: list
            fields:
              - { name: title, label: عنوان الخبر, widget: string }
              - { name: date, label: التاريخ, widget: string, required: false, hint: "مثال: 2026-09-07" }
              - { name: tag, label: التصنيف, widget: select, required: false, options: [برامج, مبادرات, إنجازات, شراكات, إعلانات] }
              - { name: summary, label: ملخص قصير, widget: text, required: false }
              - { name: image, label: صورة الخبر, widget: image, required: false }
          - name: coverage
            label: التغطيات (فيديوهات يوتيوب)
            widget: list
            hint: تظهر في قسم «رواسم اليوم» بالرئيسية وفي المركز الإعلامي
            fields:
              - { name: id, label: معرّف فيديو يوتيوب, widget: string, hint: "الجزء بعد watch?v= في الرابط" }
              - { name: title, label: العنوان, widget: string }
              - { name: tag, label: التصنيف, widget: string, required: false }
          - name: releases
            label: المحتوى والإصدارات
            widget: list
            fields:
              - { name: title, label: عنوان الإصدار, widget: string }
              - { name: type, label: التصنيف, widget: select, options: [الأدلة, الحقائب, الإصدارات] }
              - { name: desc, label: وصف مختصر, widget: text, required: false }
              - { name: file, label: الملف (PDF), widget: file, required: false }

      - name: partners
        label: شعارات الشركاء
        file: content/partners.json
        fields:
          - name: logos
            label: الشعارات
            widget: list
            fields:
              - { name: image, label: ملف الشعار, widget: image }
              - { name: name, label: اسم الجهة, widget: string }
